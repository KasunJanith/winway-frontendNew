<!DOCTYPE html>
<html>
<head>
  <title>Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 15px;
      margin-top: 15px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

<div class="card">
  <h1 id="msg">Hello 👋</h1>
  <p>Welcome! Watch this short introduction.</p>

  <div class="video-container">
    <iframe
      src="https://www.youtube.com/embed/roNngUDcO00?autoplay=1&mute=1&playsinline=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>
</div><iframe
  width="100%"
  height="300"
  src="https://www.youtube.com/embed/roNngUDcO00?rel=0&autoplay=1&mute=1&playsinline=1"
  title="WIN WAY Intro"
  frameborder="0"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
  allowfullscreen>
</iframe>

<script>
  const name = new URLSearchParams(window.location.search).get("name");
  if (name) {
    document.getElementById("msg").textContent = "Hello, " + name + " 👋";
  }
</script>

</body>
</html>
